<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌌宇宙よろず相談室 📻#001</title>

    <link rel="stylesheet" href="/cmn/style.css">
    <link rel="stylesheet" href="/cmn/ucyu.css">
    <link rel="stylesheet" href="/cmn/header.css">
    <link rel="stylesheet" href="/cmn/top.css">
    <link rel="stylesheet" href="/cmn/main.css">
    <link rel="stylesheet" href="/cmn/anime_001.css">
    <link rel="stylesheet" href="/cmn/anime.css">

    <script>
        window.追加読み込みリスト = [
            '/img/logo_subtitle.webp',
            '/img/logo_fukidasi.webp',
            '/pct/hosocyu_yuka.webp',
            '/pct/hosocyu_unich.webp',
            '/pct/hosocyu.webp',
            '/pct/hosocyu_hosoto.webp'
        ];
    </script>
    <script src="/cmn/script.js" defer></script>
</head>

<body data-app-base-time="11000" data-entry-base-time="9000"> <!-- ⚠️出現基準時間 & 登場基準時間 -->


<!-- ↔️ローディング・マスク -->

<div id="暗幕"></div>


<!-- ↔️ヘッダ -->

<header class="ヘッダ">

    <!-- 🔹ロゴ -->

    <div id="ロゴ" class="ロゴ">

        <div class="発光 横滑" style="--待機: 1s;">
            <div class="縮小"  style="--待機: 10s;">
                <img src="/img/logo.webp" alt="🦉宇宙よろず相談室🐰">
                <img src="/img/logo_subtitle.webp"  class="差分 消滅"       style="--待機: 20s;">
                <img src="/img/logo_onair_001.webp" class="差分 出現"       style="--待機: 21s;">
                <img src="/img/logo_fukidasi.webp"  class="差分 出現→消滅" style="--待機: 3s; --時間: 8s;">
            </div>
        </div>

    </div>

    <!-- 🔹開発と設定 -->

    <div id="開発コンテナ"></div>
    <div id="設定コンテナ"></div>

</header>


<!-- ↔️サイト概要 -->

<!-- 🔹宇宙視差背景 ⚠️--ずれ幅と--視差速度はページ長さによって調整する -->

<main class="宇宙全体" style="--ずれ幅: 150vh; --視差速度: -10px;">

    <div class="宇宙レイヤー 遠景"></div>
    <div class="宇宙レイヤー 中景"></div>
    <div class="宇宙レイヤー 流星"></div>
    <div class="宇宙レイヤー 近景"></div>
    <div class="星群"></div>

    <div class="改幅15"></div>

    <!-- 🔹トップ画像 -->

    <div class="画像 改幅">
        <img src="/pct/hosocyu_yuka.webp">
        <img src="/pct/hosocyu_unich.webp"  class="差分 ネオン">
        <img src="/pct/hosocyu_hosoto.webp" class="差分 出現"      style="--待機: 4s;">
        <img src="/pct/hosocyu.webp"        class="差分 落下 発光" style="--待機: 2s;" alt="🥸ドクと🐰ユニちゃん">
    </div>

    <!-- 🔹概要文 -->

    <p class="先頭装飾 出現" style="--待機: 5s;">
        この番組は、幸せを与えない。<br>
        なぜなら、あなたが幸せの<em>中心</em>だから。
    </p>

    <p class="出現" style="--待機: 6s;">
        この番組は、誰の人生も良くしない。<br>
        なぜなら、誰もが<em>完璧</em>な配役で、何も良くする必要はないから。
    </p>

    <p class="出現 改幅" style="--待機: 7s;">
        これは、問題の克服を目指すのではなく、「最初から問題はなかった」と、<em>前提</em>を替える番組である✨
    </p>


    <!-- 🔹コンテンツリンク -->

    <p class="星群 ▼"></p> <!-- ▼ は JS でスクロール出現を監視 (data-th で出現割合を指定) -->

    <p>
        <a href="cnt/oa_001.html">ON AIR #001</a>
    </p>
    

</main> <!-- 宇宙全体 ここまで -->


<!-- ↔️SVGフィルタ -->

<div id="SVGフィルタ"></div>

</body>
</html>
