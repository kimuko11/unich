<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📻宇宙よろず相談室 🎬#001 - 2</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ucyu.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="top.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="anime_001.css">
    <link rel="stylesheet" href="anime.css">

    <script src="script.js" defer></script>
</head>
<body>

<!-- ↔️ローディング・マスク -->

<div id="暗幕"></div>


<!-- ↔️ヘッダー -->

<header class="ヘッダー">

    <!-- 🔹ロゴ -->

    <div class="ロゴ 発光 横滑" style="--待機: 1s;">
        <a href="index.html">
            <img src="img/logo_subtitle.webp"  class="動作 消滅" style="--待機: 10s;">
            <img src="img/logo_onair_001.webp" class="動作 出現" style="--待機: 11s;">
            <img src="img/logo.webp" alt="宇宙よろず相談室 ロゴ">
        </a>
        <img src="img/logo_fukidasi.webp" class="動作 出現→消滅" style="--待機: 3s; --時間: 8s; pointer-events: none;">
    </div>

    <!-- 🔹表示範囲 (検証用) -->

    <div class="表示範囲">
        表示範囲
        <button type="button" onclick="範囲リセット()">🗑️</button>
        
        <div style="display: flex; gap: 2px;">

            <div style="display: flex;">
                <input type="number" id="非表示上" min="1">
                <div class="縦列">
                    <button type="button" class="スピンボタン" onclick="数値変更('非表示上', -1)">🔼</button>
                    <button type="button" class="スピンボタン" onclick="数値変更('非表示上',  1)">🔽</button>
                </div>
            </div>

            <div style="display: flex;">
                <input type="number" id="非表示下" min="1">
                <div class="縦列">
                    <button type="button" class="スピンボタン" onclick="数値変更('非表示下', -1)">🔼</button>
                    <button type="button" class="スピンボタン" onclick="数値変更('非表示下',  1)">🔽</button>
                </div>
            </div>

        </div>

    </div>

    <!-- 🔹設定 -->

    <div class="設定" id="設定">
        <img src="img/radio-s.webp" alt="ラジオ" id="ラジオ" class="ラジオ 発光 出現" style="--待機: 1s;">
        <div class="出現→消滅" style="--待機: 1s; margin-top: -8px;">設定</div>

        <div class="設定💬">

            <div class="設定項目">
                効果音量
                <label class="スライダー">
                    小<input type="range" id="効果音量" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字サイズ
                <label class="スライダー">
                    小<input type="range" id="文字サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                画像サイズ
                <label class="スライダー">
                    小<input type="range" id="画像サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字速度
                <label class="スライダー">
                    遅<input type="range" id="文字速度" max="9" min="0" value="4">速
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                アニメ速度
                <label class="スライダー">
                    遅<input type="range" id="アニメ速度" max="9" min="0" value="4">速
                    <span class="スライダー数値">4</span>
                </label>
            </div>
            
            <div class="設定グループ">

                <div class="設定項目">
                    光の効果
                    <label class="スイッチ">
                        <input type="checkbox" id="光の効果" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    登場アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="登場アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    表情アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="表情アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

            </div> <!-- 設定グループ ここまで -->

            <button type="button" id="リセット" class="リセット">初期値に戻す</button>

        </div> <!-- 設定💬 ここまで -->

    </div> <!-- 設定 ここまで -->

</header>


<!-- ↔️サイト概要 -->

<!-- 🔹宇宙視差背景 ⚠️--ずれ幅と--視差速度はページ長さによって調整する -->

<main class="宇宙全体" style="--ずれ幅: 150vh; --視差速度: -100px;">

    <div class="宇宙レイヤー 遠景"></div>
    <div class="宇宙レイヤー 中景"></div>
    <div class="宇宙レイヤー 流星"></div>
    <div class="宇宙レイヤー 近景"></div>
    <div class="星群"></div>


    <!-- ↔️メインコンテンツ -->

    <!-- 🔹1画面弱の空白と流星 -->

    <div class="画像" style="margin: calc(50vh - var(--画像サイズ, 4) * 4vh) 0;">
        <img src="img/ryusei.webp" class="流星大">
    </div>

    <!-- 🔹対話 -->

    <div class="描画省略" style="--省略幅: 550vh;"> <!-- 60 ～  -->
    <div class="対話全体枠">

        <!-- 
        ◾利用できる CSS 変数
        🥸, 🐰:    --間隔 px (上との間隔の増減)
        キャラ画像: --サイズ % (画像サイズの増減),  --被り幅 px (ふきだしへの被り幅の増減)
        💬:        --左/右尻尾 px (尻尾距離の増減) --左/右余白 % (ふきだし占有率の増減)

        ◾アニメ変数
        --起点 %, --時間 s, --待機 s, ( --倍率 0, --距離 px, --角度 deg)

        ◾カスタムデータ
        data-speed  文字速度の倍率 (20倍で通常の1行相当の時間)
        data-wait   セリフ終了後のタメ文字数
        data-se     効果音 URL
        data-volume 音量の倍率 (SE音量はデフォ0.1、最大0.22なので、5倍までを推奨)
        -->

        <div class="🐰">
            <div class="キャラ画像 身体_縦伸" style="--被り幅: 10px;">
                <img src="cha/ua_makasero.webp">
                <img src="cha/ua_makasero_hikari.webp"   alt="✨" class="動作 発射→拍動" style="--起点: 90% 43.5%; --倍率: 1.3;">
                <img src="cha/ua_makasero_kuchi.webp"    alt="👄" class="動作 口元" style="--起点: 50% 59%;">
                <img src="cha/ua_makasero_makasero.webp" alt="💨" class="動作 発射" style="--起点: 50% 70%; --時間: 2s; --待機: 1s;">
                <img src="cha/ua_makasero_ude.webp"      alt="💪" class="動作 発射" style="--起点: 50% 90%; --倍率: 1.05;">

            </div>
            <div class="💬 中速" style="--左尻尾: 30px;">
                じゃあ、ユニちゃんがよい気分を保てゆと思う見方を発表すゆでしゅ。
            </div>
        </div>

        <div class="🥸">
            <div class="キャラ画像 身体_縦伸" style="--被り幅: 10px;">
                <img src="cha/dt_ok-migi.webp">
            </div>
            <div class="💬" style="--右余白: 7%; --右尻尾: -30px; padding-left: 40px; padding-right: 40px;">
                ヨロw
            </div>
        </div>

        <div class="🐰" style="--間隔: -20px;">
            <div class="キャラ画像 身体_横揺">
                <img src="cha/ut_genkina-aisatu.webp">
                <div class="動作 発射">
                    <img src="cha/ut_genkina-aisatu_hosi.webp"       alt="⭐" class="回転" style="--起点: 89% 34%;">
                </div>
                <img src="cha/ut_genkina-aisatu_kuchi.webp"   alt="👄" class="動作 口元">
                <div class="動作 発射" style="--起点: 40% 100%; --倍率: 1.05;">
                    <img src="cha/ut_genkina-aisatu_ude.webp" alt="💪" class="横揺" style="--起点: 25% 95%; --角度: 10deg;">
                </div>
            </div>
            <div class="💬 中速">
                その親友ちゃんも、<em>じぶんと同じく神</em>なのでしゅ！<br>
                だから偶像崇拝も、神の体験なのでしゅ！<br>
                まちがいや正解があゆんじゃなくて、ぜんぶ「<em>神の遊び</em>」！<br>
                ゆってみれば、データ収集をとおちた神自身の拡大に貢献ちてゆのでしゅ、<em>みんなで</em>！<br>
                だから善も悪もなく、なんでもOKのただひとつの善ちかない…<br>
                このひとつきりの善が「愛」で、神の本性なのでしゅ！😁ドヤ!!
            </div>
        </div>

    </div>
    </div> <!--  ～  ここまで -->

    <div style="height: 100vh;"></div>

</main> <!-- 宇宙全体 ここまで -->


<!-- ↔️SVGフィルター -->

<svg style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <defs>

        <filter id="白枠">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="expanded" />
            <feFlood flood-color="seashell" flood-opacity="1" result="color" />
            <feComposite in="color" in2="expanded" operator="in" result="outline" />

            <feMerge> <!-- 元の画像をその上に重ねる -->
                <feMergeNode in="outline" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="黒枠">
            <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded" />
            <feFlood flood-color="black" flood-opacity="1" result="color" />
            <feComposite in="color" in2="expanded" operator="in" result="outline" />

            <feMerge>
                <feMergeNode in="outline" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

    </defs>
</svg>
