<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📻宇宙よろず相談室 🎬#001 - CM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ucyu.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="top.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="anime_001.css">
    <link rel="stylesheet" href="anime.css">

    <script src="script.js" defer></script>
</head>
<body>

<!-- ↔️ローディング・マスク -->

<div id="暗幕"></div>


<!-- ↔️ヘッダー -->

<header class="ヘッダー" style="height: 130px;">

    <!-- 🔹設定 -->

    <div class="設定" id="設定">
        <img src="img/radio-s.webp" alt="ラジオ" id="ラジオ" class="ラジオ 発光 出現">

        <div class="設定💬">

            <div class="設定項目">
                効果音量
                <label class="スライダー">
                    小<input type="range" id="効果音量" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字サイズ
                <label class="スライダー">
                    小<input type="range" id="文字サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                画像サイズ
                <label class="スライダー">
                    小<input type="range" id="画像サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字速度
                <label class="スライダー">
                    遅<input type="range" id="文字速度" max="9" min="0" value="4">速
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                アニメ速度
                <label class="スライダー">
                    遅<input type="range" id="アニメ速度" max="9" min="0" value="4">速
                    <span class="スライダー数値">4</span>
                </label>
            </div>
            
            <div class="設定グループ">

                <div class="設定項目">
                    光の効果
                    <label class="スイッチ">
                        <input type="checkbox" id="光の効果" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    登場アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="登場アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    表情アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="表情アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

            </div> <!-- 設定グループ ここまで -->

            <button type="button" id="リセット" class="リセット">初期値に戻す</button>

        </div> <!-- 設定💬 ここまで -->

    </div> <!-- 設定 ここまで -->

</header>


<!-- ↔️メインコンテンツ -->

<!-- 🔹宇宙視差背景 ⚠️--ずれ幅と--視差速度はページ長さによって調整する -->

<main class="宇宙全体" style="--ずれ幅: 150vh; --視差速度: -10px;">

    <div class="宇宙レイヤー 遠景"></div>
    <div class="宇宙レイヤー 中景"></div>
    <div class="宇宙レイヤー 流星"></div>
    <div class="宇宙レイヤー 近景"></div>
    <div class="星群"></div>

    <!-- 🔹架空CM -->

    <p class="白枠 改行">
        <span class="黒枠 極大 出現" style="--待機: 1s;">🎞️</span>
        <span class="動作 黒枠 大字 太字 水 横滑" style="top: 0.4em; margin-left: 0.5rem; --待機: 1s;">こまーしゃる</span>
    </p>

    <!-- 🔹広告 -->

    <div class="画像 改行2">
        <img src="pic/cm_001.webp" class="発光 拡大" style="--待機: 3s; --時間: 2s;">
    </div>

    <!-- 🔹演奏隊 -->

    <p class="改行12" style="display: flex; justify-content: space-between;">
        <img src="img/pixy_chello.gif" class="横滑" style="--待機: 2s; --方向: -1;">
        <img src="img/pixy_acco.gif"   class="落下" style="--待機: 2s;">
        <img src="img/pixy_drum.gif"   class="落下" style="--待機: 2s;">
        <img src="img/pixy_rappa.gif"  class="横滑" style="--待機: 2s; --方向: 1;">
    </p>

    <!-- 🔹流星 -->

    <div class="画像 改行3">
        <img src="img/ryusei.webp" class="流星大 ▼">
    </div>

    <!-- 🔹次ページへ -->

    <div class="対話全体枠">
        <div class="📻">
            <div class="キャラ画像">
                <a href="index2.html">
                    <img src="img/radio.webp">
                    <img src="img/radio_onpu.webp" alt="🎵" class="動作 発射→拍微動" style="--起点: 50% 50%; --時間2: 2s;">
                </a>
            </div>
            <div class="💬" style="--右尻尾: 15px;">
                <a href="index2.html">
                    タップして、<br>
                    「宇宙よろず相談室」<br>
                    再開します♪
                </a>
            </div>
        </div>
    </div>

</main> <!-- 宇宙全体 ここまで -->


<!-- ↔️SVGフィルター -->

<svg style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <defs>

        <filter id="白枠">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="expanded" />
            <feFlood flood-color="seashell" flood-opacity="1" result="color" />
            <feComposite in="color" in2="expanded" operator="in" result="outline" />

            <feMerge> <!-- 元の画像をその上に重ねる -->
                <feMergeNode in="outline" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="黒枠">
            <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded" />
            <feFlood flood-color="black" flood-opacity="1" result="color" />
            <feComposite in="color" in2="expanded" operator="in" result="outline" />

            <feMerge>
                <feMergeNode in="outline" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

    </defs>
</svg>
