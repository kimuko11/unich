<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌌宇宙よろず相談室 🌜CM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ucyu.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="top.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="cm.css">
    <link rel="stylesheet" href="anime_001.css">
    <link rel="stylesheet" href="anime.css">

    <script>
        window.追加読み込みリスト = [
            'img/enso_acco.webp',
            'img/enso_chello.webp',
            'img/enso_rappa.webp',
            'img/enso_drum.webp',
            'pic/cm_001.webp'
        ];
    </script>
    <script src="script.js" defer></script>
</head>

<body data-app-base-time="4000" data-entry-base-time="12000"> <!-- ⚠️出現基準時間 & 登場基準時間 -->


<!-- ↔️ローディング・マスク -->

<div id="暗幕"></div>


<!-- ↔️ヘッダ -->

<header class="ヘッダ" style="height: 130px;">

    <!-- 🔹開発と設定 -->

    <div id="開発コンテナ"></div>
    <div id="設定コンテナ"></div>

</header>


<!-- ↔️メインコンテンツ -->

<!-- 🔹宇宙視差背景 ⚠️--ずれ幅と--視差速度はページ長さによって調整する -->

<main class="宇宙全体" style="--ずれ幅: 150vh; --視差速度: -10px;">

    <div class="宇宙レイヤー 遠景"></div>
    <div class="宇宙レイヤー 中景"></div>
    <div class="宇宙レイヤー 流星"></div>
    <div class="宇宙レイヤー 近景"></div>
    <div class="星群"></div>

    <!-- 🔹架空CM -->

    <p class="白枠 改幅10">
        <span class="黒枠 極大 出現" style="--待機: 1s;">🌜</span>
        <span class="差分 黒枠 大字 太字 橙 横滑" style="--待機: 1s; top: 0.4em;">こまーしゃる</span>
    </p>

    <!-- 🔹CM画像 (以降、次ページリンクで覆う) -->

    <a href="index2.html">

        <div class="画像">
            <img src="pic/cm_001.webp" class="発光 拡大 ▼" style="--時間: 2s;" alt="架空CM画像"
                data-se = "se/kaiso_2.mp3"
                data-sv = "0.2">
        </div>

        <!-- 🔹演奏隊 (ジングル長さで--回数を変える: 秒 x 4) -->

        <p class="発光 ▼" style="--待機2: 2s; --回数: 24; display: flex; justify-content: space-between; align-items: center; margin-top: -15px;"
                data-sw = "2"
                data-se = "jin/mus2_jgl_19.mp3"
                data-sv = "0.3">
            <img src="img/enso_acco.webp"   class="横滑→縦伸" style="--待機1: 3s; --方向: -1;">
            <img src="img/enso_chello.webp" class="落下→縦伸" style="--待機1: 2s;">
            <img src="img/enso_rappa.webp"  class="落下→縦伸" style="--待機1: 2s;">
            <img src="img/enso_drum.webp"   class="横滑→縦伸" style="--待機1: 3s; --方向: 1;">
        </p>

        <div class="縦幅20"></div>

        <!-- 🔹流星 -->

        <div class="画像">
            <img src="img/ryusei.webp" class="🌠 ▼" style="--待機: 7s;"
                data-sw = "7"
                data-se = "se/hikari_mid.mp3"
                data-sv = "0.1">
        </div>

        <!-- 🔹ガイド -->
         
        <div class="対話全体枠">

            <div class="👩">
                <div class="キャラ画像" style="--サイズ: -16%; --被り幅: -5px;">
                    <img src="cha/st_migi.webp"          alt="👩">
                    <img src="cha/st_migi_me2.webp"      alt="👀" class="差分">
                    <img src="cha/st_migi_kuchi.webp"    alt="👄" class="差分 パク" style="--起点: 50% 70%;">
                    <img src="cha/st_migi_hitosasi.webp" alt="☝️" class="差分 発射" style="--起点: 50% 100%; --倍率: 1.03;">
                </div>
                <div class="💬 小字" style="--右尻尾: -45px;"
                    data-sp = "0"
                    data-se = "se/danryoku_high.mp3"
                    data-sv = "0.3">
                    画面を<span class="操作">タップ</span>して、<br>
                    「宇宙よろず相談室」<br>
                    続きます♪  
                </div>
            </div>

        </div>

        <div class="縦幅10"></div>

        <p class="右寄 小字 銀">※こまーしゃるはフィクションです。念のため😅</p>

    </a> <!-- 次ページリンク ここまで -->
        
</main> <!-- 宇宙全体 ここまで -->


<!-- ↔️SVGフィルタ -->

<div id="SVGフィルタ"></div>

</body>
</html>
