<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌌宇宙よろず相談室 📻CM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ucyu.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="top.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="anime_001.css">
    <link rel="stylesheet" href="anime.css">

    <script>
        window.追加読み込みリスト = [
            'pimg/enso_chello.webp',
            'pic/cm_001.webp'
        ];
    </script>
    <script src="script.js" defer></script>
</head>

<body>


<!-- ↔️ローディング・マスク -->

<div id="暗幕"></div>


<!-- ↔️ヘッダ -->

<header class="ヘッダ" style="height: 130px;">

    <!-- 🔹設定 -->

    <div id="設定" class="設定">

        <div id="ラジオ" class="ラジオ 発光 出現" style="--待機: 1s;">
            <img src="img/radio_off.webp" alt="📻ラジオ" class="未タップ">
            <img src="img/radio_on.webp"  alt="📻ラジオ" class="タップ済">
        </div>
        <div class="出現→消滅" style="--待機: 1s; margin-top: -8px;">設定</div>

        <div class="ヘッダ💬">

            <div class="設定項目">
                ボイス音量
                <label class="スライダー">
                    無<input type="range" id="ボイス音量" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                効果音量
                <label class="スライダー">
                    無<input type="range" id="効果音量" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字サイズ
                <label class="スライダー">
                    小<input type="range" id="文字サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                画像サイズ
                <label class="スライダー">
                    小<input type="range" id="画像サイズ" max="9" min="0" value="4">大
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                文字速度
                <label class="スライダー">
                    遅<input type="range" id="文字速度" max="9" min="0" value="4">無
                    <span class="スライダー数値">4</span>
                </label>
            </div>

            <div class="設定項目">
                アニメ速度
                <label class="スライダー">
                    遅<input type="range" id="アニメ速度" max="9" min="0" value="4">速
                    <span class="スライダー数値">4</span>
                </label>
            </div>
            
            <div class="設定グループ">

                <div class="設定項目">
                    光の効果
                    <label class="スイッチ">
                        <input type="checkbox" id="光の効果" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    登場アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="登場アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

                <div class="設定項目">
                    表情アニメ
                    <label class="スイッチ">
                        <input type="checkbox" id="表情アニメ" checked>
                        <span class="スイッチ背景"></span>
                    </label>
                </div>

            </div>

            <div class="設定グループ">

                <div class="設定項目 表示範囲スイッチ" style="margin-bottom: -5px;">
                    開発用
                    <label class="スイッチ">
                        <input type="checkbox" id="表示範囲">
                        <span class="スイッチ背景" style="cursor: default;"></span>
                    </label>
                </div>

                <button type="button" id="リセット" class="リセット">初期値に戻す</button>

            </div>

        </div> <!-- ヘッダ💬 ここまで -->

    </div> <!-- 設定 ここまで -->

</header>


<!-- ↔️メインコンテンツ -->

<!-- 🔹宇宙視差背景 ⚠️--ずれ幅と--視差速度はページ長さによって調整する -->

<main class="宇宙全体" style="--ずれ幅: 150vh; --視差速度: -10px;">

    <div class="宇宙レイヤー 遠景"></div>
    <div class="宇宙レイヤー 中景"></div>
    <div class="宇宙レイヤー 流星"></div>
    <div class="宇宙レイヤー 近景"></div>
    <div class="星群"></div>

    <!-- 🔹架空CM -->

    <p class="白枠 改行">
        <span class="黒枠 極大 出現" style="--待機: 1s;">🎞️</span>
        <span class="差分 黒枠 大字 太字 水 横滑 ▼" style="--待機: 1s; top: 0.4em; margin-left: 0.5rem;"
            data-sw = "1"
            data-se = "se/ryusei_s.mp3"
            data-sv = "0.2">
            こまーしゃる
        </span>
    </p>

    <!-- 🔹広告画像 -->

    <div class="画像">
        <img src="pic/cm_001.webp" class="発光 拡大 ▼" style="--待機: 4s; --時間: 2s;"
            data-sw = "3"
            data-se = "jin/mus2_jgl_14.mp3"
            data-sv = "0.2">
    </div>

    <!-- 🔹演奏隊 -->

    <p style="display: flex; justify-content: space-between; align-items: center; margin-top: -20px;">
        <img src="img/enso_chello.webp" class="横滑 ▼" style="--待機: 3s; --方向: -1;">
        <img src="img/enso_chello.webp" class="落下 ▼" style="--待機: 2s;">
        <img src="img/enso_chello.webp" class="落下 ▼" style="--待機: 2s;">
        <img src="img/enso_chello.webp" class="横滑 ▼" style="--待機: 3s; --方向: 1;"
            data-sw = "3"
            data-se = "jin/mus2_jgl_10a.mp3"
            data-sv = "0.5">
    </p>

    <!-- 🔹以降、次ページリンク付き -->

    <a href="index2.html">
        <p class="空白"></p>
    </a>

    <!-- 🔹流星 -->

    <div class="画像 👆" style="width: 100%;" onclick="location.href='index2.html'">
        <img src="img/ryusei.webp" class="🌠 ▼"
            data-sw = "1"
            data-se = "se/hikari_mid.mp3"
            data-sv = "0.1">
    </div>

    <!-- 🔹ガイド -->
    <div class="対話全体枠 👆" onclick="location.href='index2.html'">
        <div class="👩">
            <div class="キャラ画像" style="--サイズ: -16%; --被り幅: -5px;">
                <img src="cha/st_migi.webp"          alt="👩">
                <img src="cha/st_migi_me2.webp"      alt="👀" class="差分">
                <img src="cha/st_migi_kuchi.webp"    alt="👄" class="差分 パク" style="--起点: 50% 70%;">
                <img src="cha/st_migi_hitosasi.webp" alt="☝️" class="差分 発射" style="--起点: 50% 100%; --倍率: 1.03;">
            </div>
            <div class="💬 小字"
                data-sp = "0"
                data-se = "jin/mus2_jgl_10b.mp3"
                data-sv = "0.5"
                style   = "--右尻尾: -45px;">
                画面を<span class="操作">タップ</span>して、<br>
                「宇宙よろず相談室」<br>
                続きます♪  
            </div>
        </div>
    </div>

    <a href="index2.html">
        <p class="空白"></p>
        <p class="右寄 小字 銀">※こまーしゃるはフィクションです。念のため。</p>
    </a>
        
</main> <!-- 宇宙全体 ここまで -->


<!-- ↔️SVGフィルター -->

<svg style="position: absolute; width: 0; height: 0; overflow: hidden;">
<defs>

    <filter id="siro-waku">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="expanded" />
        <feFlood flood-color="seashell" flood-opacity="1" result="color" />
        <feComposite in="color" in2="expanded" operator="in" result="outline" />

        <feMerge> <!-- 元の画像をその上に重ねる -->
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>

    <filter id="kuro-waku">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded" />
        <feFlood flood-color="black" flood-opacity="1" result="color" />
        <feComposite in="color" in2="expanded" operator="in" result="outline" />

        <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>

</defs>
</svg>

</body>
</html>
